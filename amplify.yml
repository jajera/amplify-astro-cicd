version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
        - |
          if [ "${AWS_BRANCH}" != "main" ]; then
            printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          fi
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
